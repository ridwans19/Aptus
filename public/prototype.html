<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warp — Skill-Matrix Resource Allocator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6F3; --surface:#FFFFFF; --surface-alt:#EEF1EC;
    --ink:#1B2430; --ink-soft:#5B6570; --ink-faint:#8A9199; --line:#DFE3DD;
    --teal:#2F6F63; --teal-soft:#E1EEEA;
    --brass:#C98A3E; --brass-soft:#F6E9D3;
    --rust:#C1554B; --rust-soft:#F5E1DE;
    --radius:14px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(27,36,48,0.04), 0 8px 24px -12px rgba(27,36,48,0.12);
  }
  html{ font-size:1rem; }
  html[data-textsize="sm"]{ font-size:0.875rem; }
  html[data-textsize="lg"]{ font-size:1.1875rem; }
  html[data-theme="dark"]{
    --bg:#12161B; --surface:#1A1F26; --surface-alt:#20262E;
    --ink:#EDEFF1; --ink-soft:#A7B0B8; --ink-faint:#6E7780; --line:#2B323B;
    --teal:#5AAF9F; --teal-soft:#1B3733;
    --brass:#E0A75E; --brass-soft:#3C2E1A;
    --rust:#E28277; --rust-soft:#3C221F;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; transition:background .15s ease, color .15s ease; }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .disp{font-family:'Space Grotesk',sans-serif;}
  button, input, select, textarea{ font-family:'Inter',sans-serif; }
  a{ color:inherit; }

  /* ---------- AUTH / ONBOARDING ---------- */
  .auth-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .auth-card{ width:100%; max-width:420px; }
  .auth-mark-row{ display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:28px; }
  .auth-title{ font-family:'Space Grotesk'; font-size:1.375rem; font-weight:700; text-align:center; }
  .auth-sub{ font-size:0.8438rem; color:var(--ink-soft); text-align:center; margin-top:6px; margin-bottom:28px; }
  .clerk-btn{
    width:100%; padding:12px 16px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); font-size:0.8438rem; font-weight:600; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:var(--shadow);
    transition:background .15s ease; color:var(--ink);
  }
  .clerk-btn:hover{ background:var(--surface-alt); }
  .clerk-badge{ width:18px; height:18px; border-radius:4px; background:var(--ink); flex-shrink:0; }
  .auth-fineprint{ text-align:center; font-size:0.6875rem; color:var(--ink-faint); margin-top:16px; }

  .field-group{ margin-bottom:16px; }
  .field-label{ font-size:0.75rem; font-weight:600; color:var(--ink-soft); margin-bottom:6px; display:block; }
  .field-hint{ font-size:0.6875rem; color:var(--ink-faint); margin-top:5px; }
  input[type=text], input[type=email], input[type=number], input[type=date], textarea, select{
    width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface); font-size:0.8125rem; color:var(--ink); outline:none;
  }
  input:focus, textarea:focus, select:focus{ border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft); }
  textarea{ resize:vertical; min-height:70px; font-family:'Inter'; }
  .btn{ padding:10px 18px; border-radius:9px; border:none; font-size:0.8125rem; font-weight:600; cursor:pointer; transition:opacity .15s ease; }
  .btn:hover{ opacity:.88; }
  .btn-primary{ background:var(--ink); color:var(--bg); }
  .btn-outline{ background:var(--surface); color:var(--ink); border:1px solid var(--line); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); }
  .btn-danger-ghost{ background:transparent; color:var(--rust); }
  .btn-full{ width:100%; }
  .btn-sm{ padding:6px 12px; font-size:0.75rem; border-radius:7px; }
  .field-row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  /* ---------- APP SHELL ---------- */
  .app{display:flex; min-height:100vh;}
  .sidebar{
    --sb-bg:#152522; --sb-bg2:#1B2F2B; --sb-ink:#F3F6F4; --sb-ink-soft:#A9BDB6; --sb-ink-faint:#6E8981;
    --sb-line:rgba(255,255,255,0.08); --sb-active:rgba(224,167,94,0.16); --sb-accent:#E0A75E;
    width:238px; flex-shrink:0; background:var(--sb-bg); border-right:1px solid var(--sb-line);
    display:flex; flex-direction:column; padding:22px 14px; position:sticky; top:0; height:100vh;
    background-image:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 26px),
      linear-gradient(160deg, var(--sb-bg) 0%, var(--sb-bg2) 100%);
    background-size: 260px 260px, 100% 100%;
    animation: sidebar-drift 40s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){ .sidebar{ animation:none; } }
  @keyframes sidebar-drift{ from{ background-position: 0 0, 0 0; } to{ background-position: 0 520px, 0 0; } }
  .brand{ display:flex; align-items:center; gap:10px; padding:4px 8px 24px 8px; }
  .brand-clickable{ border:none; background:transparent; width:100%; text-align:left; cursor:pointer; border-radius:10px; transition:background .15s ease; }
  .brand-clickable:hover{ background:rgba(255,255,255,0.06); }
  .brand-clickable:hover .settings-hint{ opacity:1; }
  .settings-hint{ opacity:0; color:var(--sb-accent); font-weight:600; transition:opacity .15s ease; }
  .settings-back{ display:flex; align-items:center; gap:9px; border:none; background:transparent; padding:6px 8px 20px 8px; cursor:pointer; font-family:'Space Grotesk'; font-weight:700; font-size:1.0625rem; color:var(--sb-ink); width:100%; text-align:left; }
  .settings-back:hover{ color:var(--sb-accent); }
  .settings-back svg{ width:18px; height:18px; flex-shrink:0; }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; gap:16px; }
  .toggle-row:not(:last-child){ border-bottom:1px solid var(--line); }
  .toggle-row-main{ display:flex; align-items:center; gap:14px; }
  .toggle-icon{ width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Space Grotesk'; font-weight:700; font-size:0.9375rem; flex-shrink:0; }
  .toggle-name{ font-weight:600; font-size:0.875rem; }
  .toggle-desc{ font-size:0.75rem; color:var(--ink-soft); margin-top:3px; max-width:420px; line-height:1.4; }
  .switch{ width:38px; height:22px; border-radius:20px; background:var(--surface-alt); border:1px solid var(--line); position:relative; cursor:pointer; flex-shrink:0; }
  .switch::after{ content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,0.2); transition:transform .15s ease; }
  .switch.on{ background:var(--teal); border-color:var(--teal); }
  .switch.on::after{ transform:translateX(16px); background:#fff; }
  .brand-mark{ width:30px; height:30px; border-radius:8px; background:linear-gradient(155deg, var(--sb-accent) 0%, #8a5f28 100%); position:relative; flex-shrink:0; }
  .brand-mark::before, .brand-mark::after{ content:''; position:absolute; background:rgba(21,37,34,0.6); }
  .brand-mark::before{ left:9px; top:5px; bottom:5px; width:2px; }
  .brand-mark::after{ left:15px; top:5px; bottom:5px; width:2px; background:rgba(21,37,34,0.35); }
  .brand-name{font-family:'Space Grotesk'; font-weight:700; font-size:1.0312rem; letter-spacing:-0.01em; color:var(--sb-ink);}
  .brand-sub{font-size:0.6562rem; color:var(--sb-ink-faint); margin-top:-2px;}

  .nav-label{ font-size:0.6562rem; text-transform:uppercase; letter-spacing:.08em; color:var(--sb-ink-faint); padding:0 12px; margin:14px 0 8px; }
  .nav-label:first-of-type{ margin-top:0; }
  .nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{ display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:9px; color:var(--sb-ink-soft); font-size:0.8438rem; font-weight:500; cursor:pointer; position:relative; border:none; background:transparent; width:100%; text-align:left; font-family:'Inter'; transition:background .15s ease, color .15s ease; }
  .nav-item svg{ width:17px; height:17px; flex-shrink:0; opacity:.75; }
  .nav-item:hover{ background:rgba(255,255,255,0.06); color:var(--sb-ink); }
  .nav-item.active{ background:var(--sb-active); color:var(--sb-accent); font-weight:600; }
  .nav-item.active svg{ opacity:1; }
  .nav-item.active::before{ content:''; position:absolute; left:-14px; top:50%; transform:translateY(-50%); width:3px; height:18px; border-radius:3px; background:var(--sb-accent); }
  .nav-item.hero:not(.active){ color:var(--sb-accent); }
  .nav-spark{ width:6px; height:6px; border-radius:50%; background:var(--sb-accent); margin-left:auto; flex-shrink:0; }

  .sidebar-foot{ margin-top:auto; padding-top:14px; border-top:1px solid var(--sb-line); display:flex; align-items:center; gap:9px; padding-left:8px; }
  .avatar-sm{ width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Space Grotesk'; font-size:0.75rem; font-weight:600; background-size:cover; background-position:center; }
  .foot-name{font-size:0.7812rem; font-weight:600; color:var(--sb-ink);}
  .foot-role{font-size:0.6875rem; color:var(--sb-ink-faint);}

  .main{ flex:1; min-width:0; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:22px 32px 18px; gap:16px; }
  .page-title{ font-family:'Space Grotesk'; font-size:1.375rem; font-weight:600; letter-spacing:-0.01em; }
  .page-sub{ font-size:0.8125rem; color:var(--ink-soft); margin-top:2px; }
  .topbar-actions{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .week-nav{ display:flex; align-items:center; gap:10px; }
  .week-nav button, .icon-btn{ width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--surface); cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); }
  .week-nav button:hover, .icon-btn:hover{ background:var(--surface-alt); }
  .icon-btn svg{ width:16px; height:16px; }
  .week-label{ font-size:0.8125rem; font-weight:600; font-family:'IBM Plex Mono'; min-width:150px; text-align:center; }
  .content{ padding:0 32px 48px; }

  .settings-wrap{ position:relative; }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
  .panel-head{ padding:16px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .panel-head h3{ font-family:'Space Grotesk'; font-size:0.9375rem; margin:0; font-weight:600; }
  .pill{ font-size:0.5938rem; padding:2px 7px; border-radius:20px; font-weight:600; background:var(--surface-alt); color:var(--ink-soft); }
  .pill.req{ background:var(--teal-soft); color:var(--teal); }
  .pill.warn{ background:var(--rust-soft); color:var(--rust); }

  /* ---------- DASHBOARD ---------- */
  .dash-search-wrap{ position:relative; max-width:320px; margin-bottom:22px; }
  .dash-search-results{ position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); overflow:hidden; z-index:20; display:none; }
  .dash-search-results.open{ display:block; }
  .dash-search-item{ display:flex; align-items:center; gap:10px; padding:9px 12px; cursor:pointer; font-size:0.7812rem; }
  .dash-search-item:hover{ background:var(--surface-alt); }
  .dash-search-empty{ padding:12px; font-size:0.75rem; color:var(--ink-faint); }

  .dash-hero{ display:flex; align-items:stretch; gap:0; padding:6px 0 30px; flex-wrap:wrap; }
  .dash-stat{ padding:0 28px; }
  .dash-stat:first-child{ padding-left:0; }
  .dash-stat:not(:last-child){ border-right:1px solid var(--line); }
  .dash-num{ font-family:'Space Grotesk'; font-size:2.125rem; font-weight:700; letter-spacing:-0.01em; line-height:1; }
  .dash-label{ font-size:0.75rem; color:var(--ink-soft); margin-top:6px; }
  .dash-flag{ font-size:0.6875rem; margin-top:8px; display:flex; align-items:center; gap:5px; font-weight:600; }
  .dash-flag .dot{ width:6px; height:6px; border-radius:50%; }

  .dash-section{ padding:26px 0 8px; border-top:1px solid var(--line); }
  .dash-section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; }
  .dash-section-head h3{ font-family:'Space Grotesk'; font-size:0.9688rem; font-weight:600; margin:0; }

  .workload-row{ display:flex; align-items:center; gap:14px; padding:11px 8px; margin:0 -8px; border-radius:10px; cursor:pointer; transition:background .12s ease; }
  .workload-row:hover{ background:var(--surface-alt); }
  .thread-track{ flex:1; height:6px; background:var(--surface-alt); border-radius:6px; position:relative; }
  .thread-fill{ height:100%; border-radius:6px; }

  .coverage-row{ display:flex; align-items:center; gap:16px; padding:12px 0; flex-wrap:wrap; }
  .coverage-item{ display:flex; align-items:center; gap:8px; }
  .coverage-item .dot{ width:7px; height:7px; border-radius:50%; }
  .coverage-item span{ font-size:0.7812rem; }

  /* ---------- CALENDAR (grid-based, supports multi-day blocks) ---------- */
  .allocate-layout{ display:grid; grid-template-columns:1fr 270px; gap:18px; align-items:start; }
  .cal-wrap{ overflow-x:auto; }
  .cal-grid{ min-width:640px; }
  .cal-header-row{ display:grid; grid-template-columns:190px repeat(5,1fr); }
  .cal-body-row{ display:grid; grid-template-columns:190px 1fr; }
  .cal-header-row{ border-bottom:1px solid var(--line); }
  .cal-header-emp, .cal-header-day{ font-size:0.7188rem; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; padding:12px 10px; }
  .cal-header-day{ border-left:1px solid var(--line); }
  .cal-body-row{ border-bottom:1px solid var(--line); }
  .cal-body-row:last-child{ border-bottom:none; }
  .emp-cell{ padding:10px; display:flex; align-items:center; }
  .emp-id{ display:flex; align-items:center; gap:10px; }
  .avatar{ width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Space Grotesk'; font-size:0.7812rem; font-weight:600; background-size:cover; background-position:center; }
  .emp-name{ font-size:0.8125rem; font-weight:600; }
  .cap-bar-track{ height:5px; background:var(--surface-alt); border-radius:4px; margin-top:5px; width:110px; overflow:hidden; }
  .cap-bar-fill{ height:100%; border-radius:4px; }
  .cap-txt{ font-size:0.6562rem; color:var(--ink-faint); margin-top:3px; }

  .cal-daysarea{ position:relative; display:grid; grid-template-columns:repeat(5,1fr); }
  .cal-daycol{ border-left:1px solid var(--line); min-height:70px; padding:4px; transition:background .12s ease, box-shadow .12s ease; }
  .cal-daycol.unavailable{ background:repeating-linear-gradient(135deg, var(--surface-alt), var(--surface-alt) 6px, #e4e7e1 6px, #e4e7e1 7px); }
  .cal-daycol.dragover{ background:var(--teal-soft); box-shadow:inset 0 0 0 1.5px var(--teal); }
  .cal-daycol.denied{ background:var(--rust-soft) !important; box-shadow:inset 0 0 0 1.5px var(--rust) !important; }
  .day-off-label{ display:flex; flex-direction:column; align-items:center; gap:4px; font-size:0.625rem; color:var(--ink-soft); text-align:center; padding:16px 6px 0; line-height:1.3; }
  .day-off-label svg{ width:13px; height:13px; opacity:.6; flex-shrink:0; }
  .day-off-label span{ display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

  .task-block{ position:absolute; border-radius:10px; padding:7px 9px 8px; cursor:grab; border:1px solid transparent; }
  .task-block:active{ cursor:grabbing; }
  .task-block.match-high{ background:var(--teal-soft); border-color:#c3ddd6; }
  .task-block.match-mid{ background:var(--brass-soft); border-color:#ecd3a4; }
  .task-block.match-low{ background:var(--rust-soft); border-color:#eec4bf; }
  .chip-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:6px; }
  .chip-name{ font-size:0.7188rem; font-weight:600; line-height:1.25; }
  .chip-hrs{ font-size:0.625rem; color:var(--ink-soft); margin-top:3px; }
  .dial{ flex-shrink:0; }
  .resize-handle{ position:absolute; right:-3px; top:0; bottom:0; width:12px; cursor:ew-resize; }
  .resize-handle::after{ content:''; position:absolute; right:4px; top:50%; transform:translateY(-50%); width:3px; height:16px; border-radius:3px; background:rgba(0,0,0,0.18); }
  .block-remove{ position:absolute; top:-7px; right:-7px; width:18px; height:18px; border-radius:50%; background:var(--surface); border:1px solid var(--line); color:var(--ink-faint); font-size:0.75rem; display:none; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .task-block:hover .block-remove{ display:flex; }
  .block-remove:hover{ color:var(--rust); }

  .tray-item{ border:1px dashed var(--line); border-radius:10px; padding:10px 11px; margin:10px 12px; cursor:grab; background:var(--surface); }
  .tray-item:active{ cursor:grabbing; }
  .tray-item-name{ font-size:0.7812rem; font-weight:600; }
  .tray-item-meta{ font-size:0.6562rem; color:var(--ink-soft); margin-top:4px; display:flex; gap:8px; flex-wrap:wrap; }
  .tray-empty{ padding:26px 18px; text-align:center; font-size:0.75rem; color:var(--ink-faint); }

  /* ---------- SKILL MATRIX ---------- */
  table.matrix{ width:100%; border-collapse:collapse; }
  table.matrix th, table.matrix td{ padding:11px 14px; border-bottom:1px solid var(--line); text-align:left; }
  table.matrix th{ font-size:0.6875rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); font-weight:600; }
  .dotrow{ display:flex; gap:3px; align-items:center; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--surface-alt); }
  .dot.filled{ background:var(--teal); }

  /* ---------- LIST ROWS ---------- */
  .list-row{ display:flex; align-items:center; gap:14px; padding:14px 18px; }
  .list-row:not(:last-child){ border-bottom:1px solid var(--line); }
  .skill-tag-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:5px; }
  .skill-tag{ font-size:0.6562rem; background:var(--surface-alt); padding:3px 8px; border-radius:6px; display:flex; align-items:center; gap:5px; }
  .skill-tag button{ border:none; background:transparent; cursor:pointer; color:var(--ink-faint); font-size:0.6875rem; padding:0; }
  .skill-tag button:hover{ color:var(--rust); }

  .inline-form{ padding:16px 18px; background:var(--surface-alt); border-bottom:1px solid var(--line); display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .inline-form .field-group{ margin-bottom:0; flex:1; min-width:140px; }

  /* ---------- SKILLS PAGE ---------- */
  .skill-chip-cloud{ display:flex; flex-wrap:wrap; gap:8px; padding:18px; }
  .skill-chip{ display:flex; align-items:center; gap:8px; background:var(--surface-alt); padding:6px 6px 6px 12px; border-radius:20px; font-size:0.7812rem; font-weight:600; }
  .skill-chip button{ border:none; background:var(--surface); width:18px; height:18px; border-radius:50%; cursor:pointer; color:var(--ink-faint); font-size:0.6875rem; }
  .skill-chip button:hover{ color:var(--rust); }
  .add-skill-row{ display:flex; gap:8px; padding:0 18px 18px; }
  .add-skill-row input{ flex:1; }

  /* ---------- SMART ALLOCATE ---------- */
  .seg-switch{ display:inline-flex; background:var(--surface-alt); border-radius:10px; padding:3px; gap:2px; }
  .seg-switch button{ border:none; background:transparent; padding:7px 14px; font-size:0.7812rem; font-weight:600; color:var(--ink-soft); border-radius:8px; cursor:pointer; }
  .seg-switch button.active{ background:var(--ink); color:var(--bg); }
  .req-row{ display:grid; grid-template-columns:1fr 110px 90px 30px; gap:8px; align-items:center; margin-bottom:8px; }
  .req-row select{ padding:9px 10px; }
  .check-row{ display:flex; align-items:center; gap:6px; font-size:0.7188rem; color:var(--ink-soft); }
  .rm-btn{ border:none; background:transparent; color:var(--ink-faint); cursor:pointer; font-size:0.9375rem; }
  .rm-btn:hover{ color:var(--rust); }

  .rank-item{ display:flex; gap:16px; padding:18px; align-items:flex-start; }
  .rank-item:not(:last-child){ border-bottom:1px solid var(--line); }
  .rank-num{ font-family:'IBM Plex Mono'; font-size:1.25rem; font-weight:500; color:var(--ink-faint); width:34px; flex-shrink:0; padding-top:2px; }
  .rank-body{ flex:1; }
  .rank-name-row{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }

/* =========================================================
   SCORING HELPERS
========================================================= */
function empById(id){ return employees.find(e=>e.id===id); }
function assignedHoursInWeek(empId, offset){
  const dates = weekDates(offset).map(iso);
  return assignments.filter(a=>a.empId===empId && dates.includes(a.day)).reduce((s,a)=>s+a.hours,0);
}
function matchScore(emp, task, offset){
  const lvl = emp.skills[task.reqSkill];
  let score;
  if(lvl === undefined){ score = 28; }
  else if(lvl >= task.reqLevel){ score = Math.min(97, 80 + (lvl-task.reqLevel)*6); }
  else { score = 42 + lvl*6; }
  const remaining = emp.capacity - assignedHoursInWeek(emp.id, offset);
  if(remaining < task.hours) score = Math.round(score*0.82);
  return Math.max(12, Math.round(score));
}
function matchClass(score){ return score>=80?'match-high':score>=55?'match-mid':'match-low'; }
function matchColor(score){ return score>=80?'var(--teal)':score>=55?'var(--brass)':'var(--rust)'; }
function avatarHTML(person, size, fontSizeRem, cls){
  cls = cls || 'avatar';
  const dim = size ? `width:${size}px; height:${size}px;` : '';
  const fs = fontSizeRem ? `font-size:${fontSizeRem};` : '';
  if(person && person.photo){
    return `<div class="${cls}" style="${dim} background-image:url('${person.photo}');"></div>`;
  }
  return `<div class="${cls}" style="${dim} ${fs} background:${(person&&person.color)||'var(--teal)'};">${(person&&person.init)||'?'}</div>`;
}
function miniDial(score, size=30){
  const r=(size/2)-3, c=2*Math.PI*r, off=c-(score/100)*c, color=matchColor(score);
  return `<svg class="dial" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-alt)" stroke-width="3"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="3"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-family="IBM Plex Mono" font-size="${size*0.3}" fill="${color}" font-weight="600">${score}</text>
  </svg>`;
}

function runSmartSearch(){
  const s = state.smart;
  const reqs = s.requirements;
  const results = employees.map(emp=>{
    const missingMandatory = reqs.filter(r=>r.mandatory && !emp.skills[r.skill]);
    const perSkill = reqs.map(r=>{
      const lvl = emp.skills[r.skill];
      let sc;
      if(lvl===undefined) sc = 15;
      else if(lvl>=r.level) sc = Math.min(98, 82+(lvl-r.level)*6);
      else sc = 40+lvl*6;
      return { skill:r.skill, level:r.level, has:lvl, score:sc };
    });
    const skillScore = Math.round(perSkill.reduce((a,b)=>a+b.score,0)/perSkill.length);
    const remaining = emp.capacity - assignedHoursInWeek(emp.id,0);
    const availScore = Math.max(0, Math.min(100, Math.round((remaining/s.hours)*70)));
    const balanceScore = Math.max(0, 100 - Math.round((assignedHoursInWeek(emp.id,0)/emp.capacity)*100));
    const overall = Math.round(skillScore*0.65 + availScore*0.25 + balanceScore*0.10);

    const strong = perSkill.filter(p=>p.has!==undefined && p.has>=p.level).map(p=>p.skill);
    const weak = perSkill.filter(p=>p.has!==undefined && p.has<p.level).map(p=>`${p.skill} (has L${p.has}, needs L${p.level})`);
    const missing = perSkill.filter(p=>p.has===undefined).map(p=>p.skill);
    let explain = '';
    if(strong.length) explain += `Meets or exceeds the required level in ${strong.join(', ')}. `;
    if(weak.length) explain += `Below the requested level in ${weak.join(', ')}. `;
    if(missing.length) explain += `No recorded experience in ${missing.join(', ')}. `;
    explain += remaining >= s.hours ? `Has ${remaining}h free this week, enough to cover the ${s.hours}h estimate.` : `Only ${remaining}h free this week against a ${s.hours}h estimate — would run over capacity.`;

    return { emp, overall, missingMandatory, explain };
  });

  const eligible = results.filter(r=>r.missingMandatory.length===0).sort((a,b)=>b.overall-a.overall);
  const ineligible = results.filter(r=>r.missingMandatory.length>0);
  state.smart.results = { eligible, ineligible };
  document.getElementById('smart-results').innerHTML = renderSmartResults();
}

  return `<div class="panel">

/* =========================================================
   CALENDAR ENGINE (shared by Schedule + My Week)
========================================================= */
function computeLayout(empId, dates){
  const dateIsoList = dates.map(iso);
  const items = assignments.filter(a=>a.empId===empId && dateIsoList.includes(a.day))
    .map(a=>{
      const startIdx = dateIsoList.indexOf(a.day);
      const duration = Math.max(1, Math.min(a.duration||1, 5-startIdx));
      return { a, startIdx, duration };
    }).sort((x,y)=>x.startIdx-y.startIdx);
  const laneEnds = [];
  items.forEach(it=>{
    let lane = laneEnds.findIndex(end=> end < it.startIdx);
    if(lane===-1){ lane = laneEnds.length; laneEnds.push(it.startIdx+it.duration-1); }
    else laneEnds[lane] = it.startIdx+it.duration-1;
    it.lane = lane;
  });
  return { items, maxLanes: Math.max(1, laneEnds.length) };
}
function calHeaderHTML(dates){
  return `<div class="cal-header-row"><div class="cal-header-emp">Team member</div>
    ${dates.map(d=>`<div class="cal-header-day">${dayShort(d)} <span class="mono" style="color:var(--ink-faint); font-weight:400;">${d.getDate()}</span></div>`).join('')}
  </div>`;
}
function renderCalRow(emp, dates, editable){
  const { items, maxLanes } = computeLayout(emp.id, dates);
  const laneH = 54;
  const rowMinH = Math.max(74, maxLanes*laneH + 16);
  const used = assignedHoursInWeek(emp.id, state.weekOffset);
  const pct = Math.min(100, Math.round((used/emp.capacity)*100));
  const over = used > emp.capacity;
  const dateIsoList = dates.map(iso);

  const dayColsHTML = dates.map((d,i)=>{
    const key = dateIsoList[i];
    const off = emp.unavailableDates[key];
    return `<div class="cal-daycol ${off?'unavailable':''}" data-emp="${emp.id}" data-day="${key}">${off?`<div class="day-off-label" title="${(off.note||'Unavailable').replace(/"/g,'&quot;')}">${ICONS.clock}<span>${off.note || 'Unavailable'}</span></div>`:''}</div>`;
  }).join('');

  const blocksHTML = items.map(({a,startIdx,duration,lane})=>{
    const score = matchScore(emp, a, state.weekOffset);
    const left = startIdx/5*100, width = duration/5*100;
    return `<div class="task-block ${matchClass(score)}" style="left:calc(${left}% + 3px); width:calc(${width}% - 6px); top:${lane*laneH+6}px;" ${editable?`draggable="true" data-assignment="${a.id}"`:''}>

function unassignTask(id){
  const idx = assignments.findIndex(a=>a.id===id);
  if(idx===-1) return;
  const a = assignments[idx];
  assignments.splice(idx,1);
  unassignedTasks.push({ id:'t'+(taskSeq++), name:a.name, hours:a.hours, reqSkill:a.reqSkill, reqLevel:a.reqLevel });
  renderPage();
}
function attachDnD(){
  document.querySelectorAll('.tray-item').forEach(el=>{
    el.addEventListener('dragstart', ev=> ev.dataTransfer.setData('text/plain', JSON.stringify({type:'tray', id:el.dataset.task})));
  });
  document.querySelectorAll('.task-block').forEach(el=>{
    el.addEventListener('dragstart', ev=> ev.dataTransfer.setData('text/plain', JSON.stringify({type:'assignment', id:el.dataset.assignment})));
  });
  document.querySelectorAll('.cal-daycol').forEach(cell=>{
    cell.addEventListener('dragover', ev=>{ ev.preventDefault(); if(!cell.classList.contains('unavailable')) cell.classList.add('dragover'); });
    cell.addEventListener('dragleave', ()=> cell.classList.remove('dragover'));
    cell.addEventListener('drop', ev=>{
      ev.preventDefault(); cell.classList.remove('dragover');
      const data = JSON.parse(ev.dataTransfer.getData('text/plain'));
      const empId = cell.dataset.emp, day = cell.dataset.day, emp = empById(empId);
      if(emp.unavailableDates[day]){ cell.classList.add('denied'); setTimeout(()=>cell.classList.remove('denied'),700); return; }
      const dates = weekDates(state.weekOffset).map(iso);
      const startIdx = dates.indexOf(day);
      if(data.type==='tray'){
        const idx = unassignedTasks.findIndex(t=>t.id===data.id); if(idx===-1) return;
        const t = unassignedTasks[idx]; unassignedTasks.splice(idx,1);
        assignments.push({ id:'a'+(taskSeq++), name:t.name, hours:t.hours, reqSkill:t.reqSkill, reqLevel:t.reqLevel, empId, day, duration:1 });
      } else {
        const a = assignments.find(x=>x.id===data.id); if(!a) return;
        let dur = a.duration||1;
        dur = Math.min(dur, 5-startIdx);
        for(let i=startIdx+1;i<startIdx+dur;i++){ if(emp.unavailableDates[dates[i]]){ dur = i-startIdx; break; } }
        a.empId = empId; a.day = day; a.duration = Math.max(1,dur);
      }
      renderPage();
    });
  });
  attachResize();
}
function attachResize(){
  document.querySelectorAll('.resize-handle').forEach(handle=>{
    handle.addEventListener('mousedown', ev=>{
      ev.preventDefault(); ev.stopPropagation();
      const block = handle.closest('.task-block');
      const areaEl = block.parentElement;
      const a = assignments.find(x=>x.id===handle.dataset.assignment);
      if(!a) return;
      const emp = empById(a.empId);
      const dates = weekDates(state.weekOffset).map(iso);
      const startIdx = dates.indexOf(a.day);
      const areaRect = areaEl.getBoundingClientRect();
      const colWidth = areaRect.width/5;
      function onMove(e){
        const rel = e.clientX - areaRect.left;
        let endIdx = Math.round(rel/colWidth)-1;
        endIdx = Math.max(startIdx, Math.min(4,endIdx));
        for(let i=startIdx+1;i<=endIdx;i++){ if(emp.unavailableDates[dates[i]]){ endIdx = i-1; break; } }
        const duration = endIdx-startIdx+1;
        block.style.width = `calc(${duration/5*100}% - 6px)`;
        block.dataset.pendingDuration = duration;
      }
      function onUp(){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        a.duration = parseInt(block.dataset.pendingDuration || (a.duration||1));
        renderPage();
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

  const firstDow = (new Date(a.year, a.month, 1).getDay()+6)%7;

  for(let i=0;i<firstDow;i++) cells.push(null);

  const upcoming = Object.entries(e.unavailableDates).sort(([a],[b])=>a<b?-1:1);

    </div>
    <div class="month-grid">
      ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')}
      ${cells.map(d=>{
        if(d===null) return `<div class="day-btn blank"></div>`;
        const key = `${a.year}-${String(a.month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const off = e.unavailableDates[key];
        const sel = a.selectedDate===key;
        return `<button class="day-btn ${off?'off':''} ${sel?'selected':''}" onclick="selectAvailDate('${key}')">${d}</button>`;
      }).join('')}
    </div>
    ${a.selectedDate ? renderAvailEditor(e, a.selectedDate) : ''}
  </div>
  <div class="panel"><div class="panel-head"><h3>Marked unavailable</h3><span class="pill">${upcoming.length}</span></div>
    ${upcoming.length ? upcoming.map(([date,info])=>`
      <div class="unavail-list-item"><div><div class="unavail-date">${date}</div><div class="unavail-note">${info.note||'No reason given'}</div></div>
      <button class="btn btn-danger-ghost btn-sm" onclick="clearAvailDate('${date}')">Remove</button></div>`).join('') : `<div class="empty-note">No dates marked unavailable.</div>`}
  </div>`;
}
function renderAvailEditor(e, key){
  const existing = e.unavailableDates[key];
  return `<div class="avail-editor">
    <div class="avail-editor-date">${key}</div>
    <div class="field-group"><label class="field-label">Note (optional)</label><textarea id="avail-note" placeholder="e.g. Annual leave, medical appointment...">${existing?existing.note:''}</textarea></div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-primary btn-sm" onclick="markUnavailable('${key}')">${existing?'Update':'Mark unavailable'}</button>
      ${existing ? `<button class="btn btn-outline btn-sm" onclick="clearAvailDate('${key}')">Remove</button>` : ''}
      <button class="btn btn-ghost btn-sm" onclick="state.avail.selectedDate=null; renderPage();">Cancel</button>
    </div>
  </div>`;
}
function selectAvailDate(key){ state.avail.selectedDate = key; renderPage(); }
function markUnavailable(key){
  const note = document.getElementById('avail-note').value.trim();
  empById(CURRENT_EMPLOYEE_ID).unavailableDates[key] = { note };
  state.avail.selectedDate = null;
  renderPage();
}
function clearAvailDate(key){
  delete empById(CURRENT_EMPLOYEE_ID).unavailableDates[key];
  state.avail.selectedDate = null;
  renderPage();
}

/* =========================================================
   INIT
========================================================= */
document.documentElement.setAttribute('data-theme', state.theme);
document.documentElement.setAttribute('data-textsize', state.textSize);
render();
</script>
</body>
</html>
